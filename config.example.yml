database: /var/lib/meshcore-weather-dispatch/dispatch.sqlite3
host: 127.0.0.1
port: 8080
secret_key_env: WEATHER_DISPATCH_SECRET_KEY
# Administrator, NWS contact, polling states/interval, and
# normal transmission enablement are initialized by the installer then managed
# through authenticated Settings. Do not store credentials or secrets here.
poll_seconds: 60
timezone: America/Chicago
# The supplied systemd unit uses one worker; leave this enabled for NWS polling.
start_poller: true
# Initial trusted-LAN HTTP setup needs false. Set true before enabling HTTPS.
session_cookie_secure: false
alert_types: ["Tornado Warning", "Severe Thunderstorm Warning", "Flash Flood Warning"]
# Select a read-only discovered Companion channel in Settings after installation.
max_message_bytes: 180
device: null
