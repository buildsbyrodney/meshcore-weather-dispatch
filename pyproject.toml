[project]
name = "meshcore-weather-dispatch"
version = "0.1.0"
description = "Human-approved NWS alert dispatch console for MeshCore"
requires-python = ">=3.11"
dependencies = ["Flask>=3.0", "Flask-WTF>=1.2", "requests>=2.31", "pyserial>=3.5", "PyYAML>=6.0", "meshcore>=2.0", "gunicorn>=22.0"]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-mock>=3.14"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["dispatch*"]
