{% extends 'base.html' %}{% block content %}<h1>Companion device</h1><p class="notice">{{status}}. Scanning and testing do not transmit.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Detected serial device<select name="device"><option value="">— No device selected —</option>{% for d in devices %}<option value='{{d|tojson}}' {% if saved and (saved.device==d.device) %}selected{% endif %}>{{d.friendly}}{% if d.stable_path %} (stable: {{d.stable_path}}){% endif %}</option>{% endfor %}</select></label><button>Save selection</button></form><form method="post" action="{{url_for('console.test_device')}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button>Test selected connection</button></form><p>Detection is on demand. No matching device is ever auto-selected; ambiguous USB identities are refused.</p>{% endblock %}
