<thead><tr><th>When</th><th>Action</th><th>Alert</th><th>Operator</th><th>Detail</th></tr></thead><tbody>{% for x in history %}<tr><td data-label="When">{{x.created_at|localtime}}</td><td data-label="Action">{{x.action}}</td><td data-label="Alert" class="history-alert">{{x.alert_display}}</td><td data-label="Operator">{{x.actor or 'system'}}</td><td data-label="Detail">{{x.detail or ''}}{% if x.action=='ignored' and x.alert_status=='ignored' and not x.alert_test_only %}<form class="inline-form reopen-form" method="post" action="{{url_for('console.reopen',cap_id=x.cap_id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><input type="hidden" name="confirm" value="yes"><input type="hidden" name="reopen_token"><button type="button" class="open-reopen">Reopen</button></form>{% endif %}</td></tr>{% endfor %}</tbody>
