<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MeshCore Weather Dispatch</title><link rel="stylesheet" href="{{ url_for('static',filename='app.css') }}"></head><body><header><b>MeshCore Weather Dispatch</b>{% if session.user %}<nav><a href="{{url_for('console.index')}}">Console</a><a href="{{url_for('console.settings')}}">Settings</a><a href="{{url_for('console.test_messaging')}}">Test Messaging</a><form method="post" action="{{url_for('console.logout')}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button>Log out</button></form></nav>{% endif %}</header><main>{% for m in get_flashed_messages() %}<p class="flash">{{m}}</p>{% endfor %}{% block content %}{% endblock %}</main></body></html>
