{% for a in alerts %}<article class="alert">{% if a.test_only %}<span class="test-only">TEST ONLY</span>{% endif %}<b>{{a.revision_label or a.event}}</b> · {{a.areas}} · expires {{a.expires|localtime}}<details><summary>Details</summary><p>{{a.headline}}</p><p>Issued {{a.sent|localtime}}</p><pre>{{a.message}}</pre></details><div class="actions"><form class="send-form" method="post" action="{{url_for('console.transmit',cap_id=a.cap_id)}}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="confirm" value="yes"><input type="hidden" name="preview_token"><label>Comment <input name="comment"></label><button type="button" class="send open-send" {% if not tx_channel %}disabled{% endif %}>Send</button></form><form class="ignore-form" method="post" action="{{url_for('console.ignore',cap_id=a.cap_id)}}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="confirm" value="yes"><input type="hidden" name="ignore_token"><button type="button" class="ignore open-ignore">Ignore</button></form></div></article>{% else %}<p>No actionable configured alerts.</p>{% endfor %}
