{% for a in alerts %}<article class="alert">{% if a.test_only %}<span class="test-only">TEST ONLY</span>{% endif %}<b>{{a.revision_label or a.event}}</b> · {{a.areas}} · expires {{a.expires|localtime}}<details><summary>Details</summary><p>{{a.headline}}</p><p>Issued {{a.sent|localtime}}</p><pre>{{a.message}}</pre></details><div class="actions"><form method="post" action="{{url_for('console.transmit',cap_id=a.cap_id)}}" onsubmit="return confirm('Send this warning on the selected channel?');"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="confirm" value="yes"><label>Comment <input name="comment"></label><button class="send" {% if not tx_channel %}disabled{% endif %}>Send</button></form><form method="post" action="{{url_for('console.ignore',cap_id=a.cap_id)}}" onsubmit="return confirm('Ignore this warning?');"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="ignore">Ignore</button></form></div></article>{% else %}<p>No actionable configured alerts.</p>{% endfor %}
